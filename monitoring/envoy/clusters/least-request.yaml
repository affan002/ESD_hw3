# Phase: least-request (Part D). Equal weights; each new request goes to the host
# with fewer requests in flight, so a slow replica (more requests piling up) gets
# fewer new ones.
# Activate: scripts/lb_policy.sh least-request
#
# Same as round-robin.yaml except lb_policy.
resources:
  # ---------- HTTP → replicas' :8000 ----------
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: app_http
    # Strict DNS: every address the name resolves to is a host; re-resolved every 5 s.
    cluster_type:
      name: envoy.cluster.dns
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
        dns_lookup_family: V4_ONLY
        dns_refresh_rate: 5s
    connect_timeout: 1s
    lb_policy: LEAST_REQUEST
    # Equal weights: pick 2 hosts at random, send to the one with fewer active requests
    # ("power of two choices"; choice_count 2 is Envoy's default, stated here).
    least_request_lb_config: { choice_count: 2 }
    track_cluster_stats: { per_endpoint_stats: true }
    health_checks:
      - timeout: 1s
        interval: 2s
        no_traffic_interval: 2s  # default 60 s would slow detection while a host is idle
        unhealthy_threshold: 2
        healthy_threshold: 2
        always_log_health_check_failures: true
        http_health_check: { path: /health }
    load_assignment:
      cluster_name: app_http
      endpoints:
        - lb_endpoints:
            - endpoint: { hostname: A, address: { socket_address: { address: esd_hw3-app-1, port_value: 8000 } } }
              load_balancing_weight: 1
            - endpoint: { hostname: B, address: { socket_address: { address: esd_hw3-app-2, port_value: 8000 } } }
              load_balancing_weight: 1
            - endpoint: { hostname: C, address: { socket_address: { address: esd_hw3-app-3, port_value: 8000 } } }
              load_balancing_weight: 1

  # ---------- gRPC → replicas' :50051 (HTTP/2 upstream) ----------
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: app_grpc
    # Strict DNS: every address the name resolves to is a host; re-resolved every 5 s.
    cluster_type:
      name: envoy.cluster.dns
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
        dns_lookup_family: V4_ONLY
        dns_refresh_rate: 5s
    connect_timeout: 1s
    lb_policy: LEAST_REQUEST
    # Equal weights: pick 2 hosts at random, send to the one with fewer active requests
    # ("power of two choices"; choice_count 2 is Envoy's default, stated here).
    least_request_lb_config: { choice_count: 2 }
    track_cluster_stats: { per_endpoint_stats: true }
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    health_checks:
      - timeout: 1s
        interval: 2s
        no_traffic_interval: 2s
        unhealthy_threshold: 2
        healthy_threshold: 2
        always_log_health_check_failures: true
        grpc_health_check: {}  # grpc.health.v1 Check, service "" (the whole server)
    load_assignment:
      cluster_name: app_grpc
      endpoints:
        - lb_endpoints:
            - endpoint: { hostname: A, address: { socket_address: { address: esd_hw3-app-1, port_value: 50051 } } }
              load_balancing_weight: 1
            - endpoint: { hostname: B, address: { socket_address: { address: esd_hw3-app-2, port_value: 50051 } } }
              load_balancing_weight: 1
            - endpoint: { hostname: C, address: { socket_address: { address: esd_hw3-app-3, port_value: 50051 } } }
              load_balancing_weight: 1
