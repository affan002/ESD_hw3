# Prometheus configuration for the sensor ingestion stack.
# Mounted read-only into the prometheus container at /etc/prometheus/prometheus.yml.

global:
  # 5 s (Prometheus's default is 1 m) so experiments show changes within seconds,
  # and rate(...[1m]) always has ~12 samples to work with.
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  # The three replicas, each scraped directly by its Compose container name, never
  # through Envoy (which would return whichever replica it picked). One target per
  # replica: HTTP, gRPC, ingestion and process metrics all come from the one
  # process's /metrics (A3-2). The `replica` label is what the dashboards group by;
  # each process also reports its own idea of its name in sensor_replica_info.
  - job_name: sensor-app
    metrics_path: /metrics
    static_configs:
      - targets: ["esd_hw3-app-1:8000"]
        labels: { replica: A }
      - targets: ["esd_hw3-app-2:8000"]
        labels: { replica: B }
      - targets: ["esd_hw3-app-3:8000"]
        labels: { replica: C }

  # Envoy's own view: per-cluster and per-endpoint request counters, active
  # requests, health-check results and membership (admin endpoint).
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]

  # Node Exporter runs on the host network (see docker-compose.yml), so it is
  # reached through the Docker host gateway rather than by service name.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Experiment E2 only (scripts/cardinality_demo.sh). Targets come from
  # file_sd/cardinality-demo.json, which holds [] except while the demo runs,
  # so normally this job has no targets and nothing shows as down.
  - job_name: cardinality-demo
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/*.json"]
        refresh_interval: 5s

  # Prometheus's own metrics (scrape health, TSDB size, series count).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
