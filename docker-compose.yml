# Fixed project name, so container names (esd_hw3-api-1, …) don't depend on
# the folder name. Filebeat matches containers by these names.
name: esd_hw3

# Docker's json-file log driver with rotation: at most 3 files x 10 MB per
# container. Filebeat (Part C) reads these files; they're a short-term buffer,
# and Elasticsearch is the long-term store.
x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- Application replicas and load balancer (A3) ----------

  # Three replicas (A, B, C) by Compose scaling: esd_hw3-app-1, -2, -3. Each one
  # is one process serving HTTP on :8000 and gRPC on :50051 (A3-2), and works out
  # its own letter from its container name (app/replica.py). No published ports:
  # clients go through Envoy; Prometheus scrapes each replica by container name.
  # All replicas share the SQLite file on the `sensor-data` volume (A3-4).
  app:
    build: .
    image: sensor-api:dev
    deploy:
      replicas: 3
    expose:
      - "8000"
      - "50051"
    environment:
      DB_PATH: /data/sensors.db
      LOG_LEVEL: INFO
      STALE_AFTER_S: "30"
    volumes:
      - sensor-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *app-logging

  # The load balancer. HTTP on 127.0.0.1:8000 and gRPC (HTTP/2) on 127.0.0.1:50051,
  # the addresses A2's callers already use (A3-6); admin on 127.0.0.1:9901.
  # Listeners: monitoring/envoy/envoy.yaml. Clusters (policy, weights, health checks):
  # monitoring/envoy/active/cds.yaml, switched by scripts/lb_policy.sh (A3-9).
  envoy:
    image: envoyproxy/envoy:v1.40.2
    # Two worker threads, fixed so results do not depend on the host CPU count.
    # Each worker keeps its own round-robin position (A3-16).
    command: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "2", "--log-level", "warn"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:50052:50052"   # tcp_proxy demonstration only (Part C)
      - "127.0.0.1:9901:9901"
    volumes:
      - ./monitoring/envoy:/etc/envoy:ro
    depends_on:
      app:
        condition: service_healthy
    logging: *app-logging

  # Not started by default (profile `sim`, A3-8): the experiments need B and C to
  # get no application traffic. Start it with: docker compose --profile sim up -d simulator
  simulator:
    image: sensor-api:dev
    profiles: ["sim"]
    command: ["python", "-m", "simulator.simulate"]
    environment:
      API_URL: http://envoy:8000
      SIM_DEVICES: "20"
      SIM_INTERVAL_S: "5"
      SIM_SEED: "42"
    depends_on:
      - envoy
    logging: *app-logging

  # ---------- Metrics (Part B) ----------

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    # Lets Prometheus reach node-exporter, which listens on the host's network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - envoy

  # Host metrics (CPU, memory, disk, network) for the machine running Docker.
  # Host network and PID namespaces plus a read-only mount of / make it measure
  # the host itself rather than its own container.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      # Listen only on Docker's bridge address (what host.docker.internal
      # resolves to), so Prometheus can scrape it but the LAN can't. The
      # default, all interfaces, would publish host details on the Wi-Fi.
      - --web.listen-address=172.17.0.1:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  # Dashboards and the Prometheus datasource are provisioned from files in
  # monitoring/grafana, so the setup is reproducible with no manual clicking.
  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local use only: anyone who can reach port 3000 can view dashboards without
      # logging in. Editing needs the admin login (admin/admin on first start).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sensor-service.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------- Experiment E2 only ----------

  # Throwaway cardinality demo with its OWN metrics registry (never the app's).
  # Not started by `docker compose up`; run scripts/cardinality_demo.sh.
  cardinality-demo:
    image: sensor-api:dev
    profiles: ["e2"]
    command: ["python", "/scripts/cardinality_demo.py", "--mode", "${DEMO_MODE:-label}", "--count", "100"]
    environment:
      PYTHONPATH: /srv
    volumes:
      - ./scripts:/scripts:ro
    logging: *app-logging

  # ---------- Logs (Part C) ----------

  # Single-node Elasticsearch for the log pipeline. Security is off for local
  # use, so the port is bound to 127.0.0.1 only (not reachable from the LAN).
  elasticsearch:
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      cluster.name: sensor-logs
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Search UI for the logs. Data view and saved searches are imported by
  # logs-setup from monitoring/kibana/saved-objects.ndjson (no clicking).
  kibana:
    image: kibana:9.5.3
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_OPTIN: "false"
      NEWSFEED_ENABLED: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"  # with optIn=false this hides the "Help us improve" banner
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot job: retention policy + index template in Elasticsearch, then the
  # Kibana data view and saved searches. Idempotent; exits when done.
  logs-setup:
    image: curlimages/curl:8.16.0
    entrypoint: ["/bin/sh", "/monitoring/logs-setup.sh"]
    volumes:
      - ./monitoring:/monitoring:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  # Tails the app replicas', Envoy's and the simulator's Docker log files and ships them to
  # Elasticsearch. Runs as root (Docker's log files are root-only) with
  # read-only mounts; --strict.perms=false because the config file is owned by
  # the host user, not root.
  filebeat:
    image: elastic/filebeat:9.5.3
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      logs-setup:
        condition: service_completed_successfully

volumes:
  sensor-data:
  prometheus-data:
  grafana-data:
  es-data:
  filebeat-data:
